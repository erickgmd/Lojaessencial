services:
  - type: web
    name: essencial
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health/database
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_CATEGORY_BUCKET
        value: category-images
      - key: SUPABASE_PRODUCT_BUCKET
        value: product-images
      - key: WHATSAPP_NUMBER
        value: "619917455141"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
